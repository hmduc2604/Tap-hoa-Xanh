# Tạp Hóa Xanh - hệ thống cửa hàng tạp hóa theo kiến trúc microservice
#   docker compose up -d --build
#   Cửa hàng : http://localhost:8080        Quản trị: http://localhost:8080/admin/
#   Gateway  : http://localhost:8000/api    RabbitMQ: http://localhost:15672 (grocery / grocery)
#   Hợp đồng : http://localhost:8080/api-docs.html (OpenAPI + WSDL)
#   Scale    : docker compose up -d --scale product-service=2   (tự đăng ký registry, gateway cân bằng tải)
name: tap-hoa-xanh

x-service-env: &service-env
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production-jwt-secret}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal-service-key}
  EVENT_BUS: rabbitmq
  REGISTRY_URL: http://registry:8500
  RABBITMQ_URL: amqp://grocery:${RABBITMQ_PASSWORD:-grocery}@rabbitmq:5672/%2F
  AUTH_SERVICE_URL: http://auth-service:8001
  PRODUCT_SERVICE_URL: http://product-service:8002
  INVENTORY_SERVICE_URL: http://inventory-service:8003
  CART_SERVICE_URL: http://cart-service:8004
  ORDER_SERVICE_URL: http://order-service:8005
  PAYMENT_SERVICE_URL: http://payment-service:8006
  PROMOTION_SERVICE_URL: http://promotion-service:8007
  NOTIFICATION_SERVICE_URL: http://notification-service:8008   # *_SERVICE_URL: địa chỉ dự phòng khi registry lỗi
  AI_SERVICE_URL: http://ai-service:8009
  APP_TZ_OFFSET_HOURS: "7"
  LOG_LEVEL: INFO

x-depends-infra: &depends-infra
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  registry:
    condition: service_healthy

services:
  # ------------------------------------------------------------------ hạ tầng
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grocery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grocery}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocery -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: grocery
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-grocery}
    ports:
      # AMQP 5672 chỉ dùng trong mạng Docker nên không mở ra máy (tránh trùng với RabbitMQ khác)
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  # ------------------------------------------------------------------ tầng tích hợp: Service Registry
  registry:
    build: { context: ., dockerfile: integration/registry/Dockerfile }
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-internal-service-key}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-jwt-secret}
      SERVICE_ADVERTISE_URL: http://registry:8500
      REGISTRY_TTL_SECONDS: "30"
    restart: unless-stopped

  # ------------------------------------------------------------------ services (entity / task / utility)
  auth-service:
    build: { context: ., dockerfile: services/entity/auth-service/Dockerfile }
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://grocery:${POSTGRES_PASSWORD:-grocery}@postgres:5432/auth_db
    depends_on: *depends-infra
    restart: unless-stopped

  product-service:
    build: { context: ., dockerfile: services/entity/product-service/Dockerfile }
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://grocery:${POSTGRES_PASSWORD:-grocery}@postgres:5432/product_db
    depends_on: *depends-infra
    restart: unless-stopped

  inventory-service:
    build: { context: ., dockerfile: services/entity/inventory-service/Dockerfile }
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://grocery:${POSTGRES_PASSWORD:-grocery}@postgres:5432/inventory_db
    depends_on: *depends-infra
    restart: unless-stopped

  cart-service:
    build: { context: ., dockerfile: services/entity/cart-service/Dockerfile }
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://grocery:${POSTGRES_PASSWORD:-grocery}@postgres:5432/cart_db
    depends_on: *depends-infra
    restart: unless-stopped

  order-service:
    build: { context: ., dockerfile: services/task/order-service/Dockerfile }
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://grocery:${POSTGRES_PASSWORD:-grocery}@postgres:5432/order_db
      SHIPPING_FEE: "25000"
      FREE_SHIP_THRESHOLD: "300000"
    depends_on: *depends-infra
    restart: unless-stopped

  payment-service:
    build: { context: ., dockerfile: services/entity/payment-service/Dockerfile }
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://grocery:${POSTGRES_PASSWORD:-grocery}@postgres:5432/payment_db
      BANK_NAME: Vietcombank
      BANK_ACCOUNT_NUMBER: "0123456789"
      BANK_ACCOUNT_NAME: CUA HANG TAP HOA XANH
    depends_on: *depends-infra
    restart: unless-stopped

  promotion-service:
    build: { context: ., dockerfile: services/entity/promotion-service/Dockerfile }
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://grocery:${POSTGRES_PASSWORD:-grocery}@postgres:5432/promotion_db
    depends_on: *depends-infra
    restart: unless-stopped

  notification-service:
    build: { context: ., dockerfile: services/utility/notification-service/Dockerfile }
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://grocery:${POSTGRES_PASSWORD:-grocery}@postgres:5432/notification_db
    depends_on: *depends-infra
    restart: unless-stopped

  # Tính năng AI (gợi ý mua kèm, trợ lý mua sắm). Mặc định dùng mô hình tự huấn luyện chạy trong service (AI_ENGINE=local),
  # không cần khóa API. Đặt AI_ENGINE=llm kèm AI_API_KEY trong .env nếu muốn dùng mô hình ngôn ngữ bên ngoài (Gemini hoặc Anthropic).
  ai-service:
    build: { context: ., dockerfile: services/utility/ai-service/Dockerfile }
    environment:
      <<: *service-env
      DATABASE_URL: postgresql://grocery:${POSTGRES_PASSWORD:-grocery}@postgres:5432/ai_db
      AI_ENGINE: ${AI_ENGINE:-local}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_FALLBACK_MODELS: ${AI_FALLBACK_MODELS:-}
      AI_THINKING: ${AI_THINKING:-}
      AI_API_URL: ${AI_API_URL:-}
    depends_on: *depends-infra
    restart: unless-stopped

  # ------------------------------------------------------------------ tầng tích hợp: API Gateway / ESB
  api-gateway:
    build: { context: ., dockerfile: integration/gateway/Dockerfile }
    environment:
      <<: *service-env
      RATE_LIMIT_PER_MINUTE: "600"
      LOGIN_RATE_LIMIT_PER_MINUTE: "20"
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      - registry
      - auth-service
      - product-service
      - inventory-service
      - cart-service
      - order-service
      - payment-service
      - promotion-service
      - notification-service
      - ai-service
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  pgdata:
