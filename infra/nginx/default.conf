# nginx phục vụ giao diện tĩnh và chuyển tiếp /api/* tới API Gateway
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    client_max_body_size 5m;

    # Phân giải lại tên api-gateway qua DNS của Docker (127.0.0.11) mỗi 10 giây. Nếu để tên cố định trong proxy_pass,
    # nginx chỉ tra IP một lần lúc khởi động: gateway được tạo lại (build/up) có IP mới thì /api/* báo 502 cho tới khi restart nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $gateway http://api-gateway:8000;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ghi đè (không nối thêm) để client không giả mạo IP qua header
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
